{% extends "base.html" %}
{% block title %}账号安全 - API Pool Manager{% endblock %}
{% block body %}
<div class="layout">
  {% with active="account" %}{% include "partials/sidebar.html" %}{% endwith %}
  <main class="main">
    <h1 class="page-title">账号安全</h1>
    <div class="card" style="max-width:480px">
      <div class="card-title">修改密码</div>
      <form id="pwdForm">
        <div class="form-group"><label class="form-label">当前密码</label><input class="form-input" id="oldPwd" type="password" required></div>
        <div class="form-group"><label class="form-label">新密码</label><input class="form-input" id="newPwd" type="password" required minlength="6"></div>
        <div class="form-group"><label class="form-label">确认新密码</label><input class="form-input" id="confirmPwd" type="password" required></div>
        <button class="btn btn-primary" type="submit">保存</button>
      </form>
    </div>
  </main>
</div>
<div id="toast-container"></div>
{% endblock %}
{% block scripts %}
<script>
document.getElementById('pwdForm').addEventListener('submit',async(e)=>{
  e.preventDefault();
  const np=document.getElementById('newPwd').value;
  if(np!==document.getElementById('confirmPwd').value){showToast('两次密码不一致','error');return;}
  try{
    await api('/api/v1/auth/change-password','POST',{old_password:document.getElementById('oldPwd').value,new_password:np});
    showToast('密码已修改','success');
    e.target.reset();
  }catch(err){showToast(err.message,'error');}
});
</script>
{% endblock %}
