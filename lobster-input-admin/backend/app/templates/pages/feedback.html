{% extends "base.html" %}
{% block title %}反馈意见 - Lobster Admin{% endblock %}
{% block body %}
<div class="layout">
  {% include "partials/sidebar.html" %}
  <main class="main">
    <div class="page-title">💬 反馈意见</div>
    <div class="card">
      <div class="search-bar">
        <input id="f-email" class="form-input" placeholder="邮箱筛选" style="max-width:220px">
        <select id="f-status" class="form-select" style="max-width:140px">
          <option value="">全部状态</option>
          <option value="未处理">未处理</option>
          <option value="挂起">挂起</option>
          <option value="忽略">忽略</option>
          <option value="实现中">实现中</option>
          <option value="已实现">已实现</option>
        </select>
        <select id="f-platform" class="form-select" style="max-width:140px">
          <option value="">全部客户端</option>
          <option value="macos">Mac</option>
          <option value="windows">Windows</option>
          <option value="ios">iOS</option>
          <option value="android">Android</option>
        </select>
        <button class="btn btn-primary" onclick="loadFeedback(1)">搜索</button>
        <button class="btn btn-ghost" onclick="resetFilter()">重置</button>
      </div>
      <div class="table-wrap">
        <table>
          <thead><tr>
            <th>时间</th><th>用户</th><th>客户端</th><th>联系方式</th><th>内容</th><th>状态</th><th>操作</th>
          </tr></thead>
          <tbody id="feedback-tbody"></tbody>
        </table>
      </div>
      <div class="pagination" id="feedback-pager"></div>
    </div>
  </main>
</div>

<div class="modal-overlay" id="detail-modal">
  <div class="modal" style="max-width:680px">
    <div class="modal-title">反馈详情</div>
    <div class="modal-body">
      <pre id="detail-content" style="background:#1a1a2e;color:#e0e0e0;padding:16px;border-radius:8px;
        overflow:auto;font-size:13px;white-space:pre-wrap;word-break:break-all"></pre>
    </div>
    <div class="modal-actions">
      <button class="btn btn-ghost" onclick="closeModal('detail-modal')">关闭</button>
    </div>
  </div>
</div>

<script>
const base = "{{ base_url }}";
let currentPage = 1;
const statuses = ["未处理", "挂起", "忽略", "实现中", "已实现"];

function getToken() {
  const p = "{{ auth_cookie_name }}=";
  return document.cookie.split(';').map(c=>c.trim()).find(c=>c.startsWith(p))?.slice(p.length) || '';
}

async function api(path, options = {}) {
  const r = await fetch(base + path, {
    ...options,
    headers: {'Authorization': 'Bearer ' + getToken(), 'Content-Type': 'application/json', ...(options.headers || {})}
  });
  if (!r.ok) throw new Error(r.status);
  return r.json();
}

function esc(s) {
  return String(s || '').replace(/[&<>"']/g, ch => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[ch]));
}

async function loadFeedback(page) {
  currentPage = page;
  const email = document.getElementById('f-email').value.trim();
  const status = document.getElementById('f-status').value;
  const platform = document.getElementById('f-platform').value;
  let qs = `?page=${page}&page_size=50`;
  if (email) qs += `&email=${encodeURIComponent(email)}`;
  if (status) qs += `&status=${encodeURIComponent(status)}`;
  if (platform) qs += `&platform=${encodeURIComponent(platform)}`;

  try {
    const data = await api(`/api/v1/feedback${qs}`);
    const tbody = document.getElementById('feedback-tbody');
    if (!data.items.length) {
      tbody.innerHTML = '<tr><td colspan="7" style="text-align:center;color:#888">暂无反馈</td></tr>';
    } else {
      tbody.innerHTML = data.items.map(item => renderRow(item)).join('');
    }
    renderPager(data.total, data.page, data.page_size);
  } catch(e) {
    document.getElementById('feedback-tbody').innerHTML =
      '<tr><td colspan="7" style="color:red">加载失败: ' + e.message + '</td></tr>';
  }
}

function renderRow(item) {
  const ts = item.created_at ? item.created_at.replace('T',' ').substring(0,19) : '-';
  const contact = [item.phone, item.email].filter(Boolean).map(esc).join('<br>') || '-';
  const content = esc((item.content || '').substring(0, 80)) + ((item.content||'').length > 80 ? '…' : '');
  const client = [
    item.client_platform,
    item.app_variant,
    item.app_version,
    item.os_version,
    item.client_ip
  ].filter(Boolean).map(esc).join('<br>') || '-';
  const options = statuses.map(s => `<option value="${s}" ${item.status === s ? 'selected' : ''}>${s}</option>`).join('');
  return `<tr>
    <td style="white-space:nowrap;font-size:12px">${ts}</td>
    <td style="font-size:12px">${esc(item.user_email || '-')}</td>
    <td style="font-size:12px;max-width:180px">${client}</td>
    <td style="font-size:12px">${contact}</td>
    <td style="max-width:360px;font-size:13px">${content}</td>
    <td><select class="form-select" onchange="updateStatus('${item.id}', this.value)">${options}</select></td>
    <td><button class="btn btn-ghost" style="padding:2px 8px;font-size:12px"
      onclick='showDetail(${JSON.stringify(JSON.stringify(item))})'>详情</button></td>
  </tr>`;
}

async function updateStatus(id, status) {
  await api(`/api/v1/feedback/${id}/status`, {method: 'POST', body: JSON.stringify({status})});
  showToast('状态已更新');
}

function showDetail(jsonStr) {
  document.getElementById('detail-content').textContent = JSON.stringify(JSON.parse(jsonStr), null, 2);
  document.getElementById('detail-modal').classList.add('show');
}

function closeModal(id) { document.getElementById(id).classList.remove('show'); }
function resetFilter() {
  document.getElementById('f-email').value = '';
  document.getElementById('f-status').value = '';
  document.getElementById('f-platform').value = '';
  loadFeedback(1);
}

function renderPager(total, page, pageSize) {
  const pages = Math.ceil(total / pageSize);
  const pager = document.getElementById('feedback-pager');
  if (pages <= 1) { pager.innerHTML = `<span style="color:#888">共 ${total} 条</span>`; return; }
  let html = `<span style="color:#888;margin-right:8px">共 ${total} 条</span>`;
  if (page > 1) html += `<button class="btn btn-ghost" onclick="loadFeedback(${page-1})">上一页</button>`;
  html += `<span style="margin:0 8px">${page} / ${pages}</span>`;
  if (page < pages) html += `<button class="btn btn-ghost" onclick="loadFeedback(${page+1})">下一页</button>`;
  pager.innerHTML = html;
}

loadFeedback(1);
</script>
{% endblock %}
