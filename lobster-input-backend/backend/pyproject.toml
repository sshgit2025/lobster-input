[project]
name = "lobster-input-backend"
version = "0.1.0"
description = "龙虾输入法后端服务"
requires-python = ">=3.12"
dependencies = [
    # Web framework
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "python-multipart>=0.0.9",
    "websockets>=16.0.0",
    # LangChain core + providers
    # UsageMetadata 在 1.0+ 统一为 TypedDict
    "langchain>=1.0.0",
    "langchain-core>=1.0.0",
    "langchain-openai>=1.0.0",
    "langchain-anthropic>=1.0.0",
    "langchain-community>=0.4.0",
    # LangGraph (prebuilt react agent)
    "langgraph>=1.0.0",
    # Config & validation
    "pydantic>=2.7.0",
    "pydantic-settings>=2.3.0",
    "python-dotenv>=1.0.0",
    # OpenAI SDK (Whisper 语音识别 + LLM)
    "openai>=2.0.0",
    # Database
    "motor>=3.5.0",
    "pymongo>=4.8.0",
    # Auth & Email
    "python-jose[cryptography]>=3.3.0",
    "aiohttp>=3.9.0",
    # Audio metadata (时长校验)
    "mutagen>=1.47.0",
    # Search engine (Tavily, Agent 搜索意图)
    "tavily-python>=0.5.0",
    # Date utilities (relativedelta for monthly credit reset)
    "python-dateutil>=2.9.0",
    # 阿里云 DashScope SDK（ASR）
    "dashscope>=1.20.0",
    # HTTP 客户端
    "httpx>=0.27.0",
    "requests>=2.32.0",
    # 用户词典发音纠偏
    "jieba>=0.42.0",
    "pypinyin>=0.54.0",
    "rapidfuzz>=3.14.0",
    "jellyfish>=1.1.0",
    # 中文数字归一化（transcribe 短路径直出）
    "cn2an>=0.5.24",
    # 公开词频词表
    "wordfreq>=3.1.1,<4",
    # 短文本/单词语言识别
    "lingua-language-detector>=2.2.0,<3",
    "regex>=2026.2.28",
    # LLM 可观测性（LangWatch）
    "langwatch>=0.4.0",
    # Redis（队列/缓存）
    "redis>=5.0.0",
]
