# LangWatch 自托管 Docker Compose 配置
# 部署路径: /opt/langwatch/compose.yml
# 数据目录: /opt/langwatch/data/ (宿主机持久化挂载)
# 访问端口: 5560 (仅绑定 uat 私网 IP，由共享网关 Nginx 反代)
# 数据保留: 30天 (ClickHouse TTL 由应用层控制)

services:
  app:
    image: langwatch/langwatch:latest
    restart: always
    pull_policy: always
    environment:
      SKIP_ENV_VALIDATION: "true"
      DISABLE_PII_REDACTION: "true"
      DATABASE_URL: postgresql://YOUR_DB_USER:YOUR_DB_PASSWORD@postgres:5432/mydb?schema=mydb
      CLICKHOUSE_URL: http://default:${CLICKHOUSE_PASSWORD}@clickhouse:8123/langwatch
      REDIS_URL: redis://redis:6379
      LANGWATCH_NLP_SERVICE: http://langwatch_nlp:5561
      LANGEVALS_ENDPOINT: http://langevals:5562
      LANGWATCH_ENDPOINT: http://app:5560
      INSTALL_METHOD: docker
      NODE_ENV: production
    env_file:
      - .env
    ports:
      - "192.0.2.11:5560:5560"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      clickhouse:
        condition: service_healthy

  workers:
    image: langwatch/langwatch:latest
    command: ["pnpm", "run", "start:workers"]
    working_dir: /app/langwatch
    restart: always
    pull_policy: always
    environment:
      SKIP_ENV_VALIDATION: "true"
      DISABLE_PII_REDACTION: "true"
      DATABASE_URL: postgresql://YOUR_DB_USER:YOUR_DB_PASSWORD@postgres:5432/mydb?schema=mydb
      CLICKHOUSE_URL: http://default:${CLICKHOUSE_PASSWORD}@clickhouse:8123/langwatch
      REDIS_URL: redis://redis:6379
      LANGWATCH_NLP_SERVICE: http://langwatch_nlp:5561
      LANGEVALS_ENDPOINT: http://langevals:5562
      LANGWATCH_ENDPOINT: http://app:5560
      NODE_ENV: production
    env_file:
      - .env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      clickhouse:
        condition: service_healthy

  langwatch_nlp:
    image: langwatch/langwatch_nlp:latest
    restart: always
    pull_policy: always
    ports:
      - "5561:5561"
    environment:
      - LANGWATCH_ENDPOINT=http://app:5560

  postgres:
    image: postgres:16
    restart: always
    environment:
      POSTGRES_DB: mydb
      POSTGRES_USER: prisma
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - /opt/langwatch/data/postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U prisma -d mydb"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:alpine
    restart: always
    volumes:
      - /opt/langwatch/data/redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  clickhouse:
    image: langwatch/clickhouse-serverless:0.2.0
    restart: always
    environment:
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD}
    ports:
      - "127.0.0.1:8123:8123"
    volumes:
      - /opt/langwatch/data/clickhouse:/var/lib/clickhouse
    deploy:
      resources:
        limits:
          memory: 2g
          cpus: "1.0"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8123/ping || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
