# 共享网关私网专用邮件出口；只允许 uat，不存储邮件 API Key。
# 部署到 /www/server/panel/vhost/nginx/lobster-mail-relay.conf
log_format lobster_mail_relay '$remote_addr $request_method $uri status=$status '
                             'upstream_status=$upstream_status duration=$request_time';

server {
    # 复用已开放的 HTTP 端口，按私网 IP Host 精确匹配；不改变现有域名 vhost。
    listen 80;
    server_name 192.0.2.16;
    allow 192.0.2.11;
    deny all;
    client_max_body_size 16k;
    client_body_buffer_size 16k;
    client_body_timeout 5s;

    resolver 192.0.2.17 192.0.2.18 valid=60s ipv6=off;
    resolver_timeout 3s;

    location = /index/api/send_email {
        limit_except POST { deny all; }
        set $aoksend_host apiv2.aoksend.com;
        proxy_pass https://$aoksend_host/index/api/send_email;
        proxy_http_version 1.1;
        proxy_set_header Host apiv2.aoksend.com;
        proxy_set_header Connection "";
        proxy_ssl_server_name on;
        proxy_ssl_name apiv2.aoksend.com;
        proxy_ssl_verify on;
        proxy_ssl_verify_depth 3;
        proxy_ssl_trusted_certificate /etc/pki/tls/certs/ca-bundle.crt;
        proxy_connect_timeout 5s;
        proxy_send_timeout 10s;
        proxy_read_timeout 10s;
        proxy_next_upstream off;
        proxy_cache off;
        proxy_redirect off;
    }

    location / { return 404; }
    # 不记录请求体、查询参数、邮箱或验证码。
    access_log /www/wwwlogs/lobster-mail-relay.log lobster_mail_relay;
    error_log /www/wwwlogs/lobster-mail-relay.error.log warn;
}
